[project]
name = "kuzu-kb"
version = "0.1.0"
description = "Local knowledge base generator using Kuzu graph DB with MCP server"
requires-python = ">=3.10"
dependencies = [
    "kuzu==0.11.3",
    "fastmcp>=2.3,<3",
    "pydantic>=2.10,<2.12",
    "pydantic-settings>=2.7,<2.8",
]

[project.scripts]
kuzu-kb-server = "kuzu_kb.server:main"
kuzu-kb-ingest = "kuzu_kb.generator:main"
kuzu-kb-visualize = "kuzu_kb.visualize:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
